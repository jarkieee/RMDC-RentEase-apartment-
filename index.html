<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RentEase - Welcome</title>
    
    <style>
        /* --- Global Resets & Variables --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
              background-image: url('https://images.unsplash.com/photo-1545324418-cc1a3fa10c00?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .external-logo svg {
            width: 80px;
            height: 80px;
            fill: #1a4b8c; /* Dark blue from logo */
            stroke: #4da6ff; /* Light blue outline */
            stroke-width: 2px;
        }

         .external-logo-text {
            display: flex;
            flex-direction: column;
            line-height: 1;
        }

        .external-logo-text .rent {
            font-size: 3rem;
            font-weight: 800;
            color: #1a4b8c;
            letter-spacing: -1px;
            /* Text outline effect */
            -webkit-text-stroke: 1px #4da6ff; 
        }

        .external-logo-text .ease {
            font-size: 3rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -1px;
            margin-left: 2px;
            /* Text outline effect */
            -webkit-text-stroke: 1px #4da6ff; 
        }

        .external-logo-text .apartment {
            font-size: 1.2rem;
            color: #1a4b8c;
            font-weight: 500;
            margin-top: 5px;
            letter-spacing: 1px;
            -webkit-text-stroke: 0.5px #4da6ff;
        }

        /* --- Main Container --- */
        .welcome-container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        /* --- Card Styling --- */
        .welcome-card {
            width: 100%;
            max-width: 520px;
            background: #ffffff;
            padding: 45px 40px;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
            text-align: center;
            transition: transform 0.3s ease;
        }

        /* --- Logo Section --- */
        .logo {
            width: 80px;
            height: 80px;
            background: #062846;
            color: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            margin: 0 auto 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        /* --- Typography --- */
        .welcome-card h1 {
            color: #062846;
            font-size: 30px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .subtitle {
            color: #667085;
            font-size: 15px;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .choose-text {
            color: #344054;
            font-weight: 600;
            margin-bottom: 18px;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* --- Role Selection Buttons --- */
        .role-buttons {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .role-button {
            text-decoration: none;
            color: #062846;
            border: 1px solid #e1e7ef;
            border-radius: 12px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            text-align: left;
            transition: all 0.2s ease;
            background: #ffffff;
            cursor: pointer;
        }

        .role-button:hover {
            border-color: #1976d2;
            background: #f5f9ff;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(25, 118, 210, 0.08);
        }

        .role-icon {
            width: 48px;
            height: 48px;
            background: #eaf3ff;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 23px;
            margin-right: 15px;
            flex-shrink: 0;
            color: #1976d2;
        }

        .role-button strong {
            display: block;
            font-size: 16px;
            margin-bottom: 5px;
            color: #062846;
        }

        .role-button small {
            color: #667085;
            font-size: 13px;
            line-height: 1.4;
            display: block;
        }

        /* --- Footer --- */
        .footer {
            margin-top: 30px;
            color: #98a2b3;
            font-size: 12px;
        }

        /* --- Responsive Design --- */
        @media (max-width: 500px) {
            .welcome-container {
                padding: 15px;
            }

            .welcome-card {
                padding: 35px 22px;
                border-radius: 16px;
            }

            .welcome-card h1 {
                font-size: 25px;
            }
            
            .role-icon {
                width: 42px;
                height: 42px;
                font-size: 20px;
                margin-right: 12px;
            }
        }
    </style>
</head>

<body>

    <div class="welcome-container">

        <div class="welcome-card">

            <!-- Logo (Using SVG for a crisp, professional look) -->
            <div class="logo">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
            </div>

            <!-- Header -->
            <h1>Welcome to RentEase</h1>
            <p class="subtitle">RMDC Rental Apartment Management System</p>
            <p class="choose-text">Please select your role to continue</p>

            <!-- Role Selection -->
            <div class="role-buttons">

                <!-- Admin -->
                <a href="Admin/login.html?role=admin" class="role-button">
                    <span class="role-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </span>
                    <div>
                        <strong>Admin</strong>
                        <small>Manage the apartment system</small>
                    </div>
                </a>
                <!-- Current Tenant -->
                <a href="Admin/login.html?role=current-tenant" class="role-button">
                    <span class="role-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </span>
                    <div>
                        <strong>Current Tenant</strong>
                        <small>Manage your rental information</small>
                    </div>
                </a>

                <!-- Prospective Tenant -->
                <a href="Admin/login.html?role=prospective-tenant" class="role-button">
                    <span class="role-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"></path>
                        </svg>
                    </span>
                    <div>
                        <strong>Prospective Tenant</strong>
                        <small>Find and apply for a unit</small>
                    </div>
                </a>

            </div>

            <!-- Footer -->
            <p class="footer">© 2026 RentEase</p>

        </div>

    </div>

</body>
</html>
