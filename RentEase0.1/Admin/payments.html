<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RentEase - Payments</title>
    
    <style>
        /* --- Global Resets & Variables --- */
        :root {
            --sidebar-dark: #0f223f;
            --sidebar-light: #133261;
            --sidebar-active: #0a4da3;
            --bg-color: #f4f6f9;
            --text-main: #111827;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
            --card-shadow: 0 2px 10px rgba(0, 0, 0, 0.04);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
        }

        /* --- Layout --- */
        .layout {
            display: flex;
            height: 100vh;
        }

        /* --- Sidebar --- */
.sidebar {
    position: fixed;
    left: 0;
    top: 0;

    width: 240px;
    height: 100vh;

    background: #1E293B;
    color: white;

    display: flex;
    flex-direction: column;

    flex-shrink: 0;
    z-index: 1000;
}

/* --- Sidebar Profile --- */
.sidebar-top {
    background: transparent;

    padding: 25px 20px 20px;

    display: flex;
    flex-direction: column;
    align-items: center;

    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
}

.profile-icon {
    width: 70px;
    height: 70px;

    background-color: #E2E8F0;

    border-radius: 50%;

    display: flex;
    justify-content: center;
    align-items: center;

    margin-bottom: 12px;

    color: #475569;
}

.profile-icon svg {
    width: 40px;
    height: 40px;
}

.profile-name {
    font-size: 18px;
    font-weight: 600;

    margin-bottom: 4px;

    color: white;
}

.profile-role {
    font-size: 13px;
    color: #CBD5E1;
}

/* --- Sidebar Navigation --- */
.sidebar-nav {
    padding: 15px 0;

    display: flex;
    flex-direction: column;

    flex-grow: 1;

    overflow-y: auto;

    /* Hide scrollbar */
    scrollbar-width: none; /* Firefox */
     -ms-overflow-style: none; /* IE/Edge */
}

.nav-link {
    display: flex;
    align-items: center;

    padding: 13px 20px;

    color: #CBD5E1;

    text-decoration: none;

    font-size: 14px;

    transition: 0.2s ease;
}

.nav-link:hover {
    background: #334155;
    color: white;
}

.nav-link.active {
    background: #2563EB;
    color: white;

    font-weight: 600;
}

        /* --- Main Content Area --- */
        .main-content {
margin-left: 240px; /* Width of the sidebar */
width: calc(100% - 240px);
           flex-grow: 1;
           display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        /* Topbar */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background-color: #ffffff;
            border-bottom: 1px solid var(--border-color);
        }

        .topbar h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .notification {
            cursor: pointer;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .notification svg {
            width: 24px;
            height: 24px;
        }

        /* Dashboard Content Area */
        .dashboard-content {
            padding: 30px 40px;
            max-width: 1000px; /* Adjusted for a slightly tighter table layout */
            width: 100%;
            margin: 0 auto;
        }

        /* --- Tabs Navigation --- */
        .tabs {
            display: flex;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 30px;
            gap: 40px;
        }

        .tab {
            padding: 10px 0;
            font-size: 1.05rem;
            font-weight: 500;
            color: var(--text-muted);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s ease;
            background: none;
            border-top: none;
            border-left: none;
            border-right: none;
        }

        .tab:hover {
            color: var(--text-main);
        }

        .tab.active {
            color: var(--text-main);
            border-bottom: 2px solid #111827; /* Dark underline for active tab */
        }

        /* --- Table Container --- */
        .table-container {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden; 
            margin-bottom: 30px;
            box-shadow: var(--card-shadow);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }

        /* Table Headers */
        th {
            background-color: #ffffff;
            padding: 20px 15px;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-main);
            border-bottom: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
        }

        th:last-child {
            border-right: none;
        }

        /* Table Data */
        td {
            padding: 18px 15px;
            font-size: 0.95rem;
            color: var(--text-main);
            border-bottom: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            vertical-align: middle;
        }

        td:last-child {
            border-right: none;
        }

        /* Empty Rows for spacing (as seen in image) */
        .empty-row td {
            height: 55px;
            padding: 0;
        }

        /* --- Status Badges --- */
        .status-badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .badge-paid {
            background-color: #d1fae5; /* Light green */
            color: #10b981; /* Green text */
        }

        /* --- Action Buttons --- */
        .btn-view {
            background-color: #eff6ff;
            color: #2563eb;
            border: 1px solid #bfdbfe;
            padding: 6px 18px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-view:hover {
            background-color: #2563eb;
            color: white;
            border-color: #2563eb;
        }

        /* --- Responsive --- */
        @media (max-width: 900px) {
            .layout {
                flex-direction: column;
                overflow-y: auto;
            }
            .sidebar {
                width: 100%;
                height: auto;
            }
            body {
                overflow-y: auto;
            }
            .table-container {
                overflow-x: auto; 
            }
            .topbar, .dashboard-content {
                padding: 20px;
            }
            .tabs {
                gap: 20px;
            }
        }
    </style>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <div class="layout">

        <!-- Sidebar -->
        <aside class="sidebar">
            
            <div class="sidebar-top">
                <div class="profile-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </div>
                <h3 class="profile-name">RMDC</h3>
                <p class="profile-role">Admin</p>
            </div>

            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-link">  <span>📶</span>Dashboard</a>
                <a href="units.html" class="nav-link"><span>🏠</span>Units</a>
                <a href="tenants.html" class="nav-link"><span>👥</span>Tenants</a>
                <a href="payments.html" class="nav-link active"><span>💳</span>Payments</a>
                <a href="appointments.html" class="nav-link"><span>📅</span>Appointments</a>
                <a href="maintenance.html" class="nav-link"><span>🔧</span>Maintenance</a>
                <a href="settings.html" class="nav-link"><span>⚙️</span>Settings</a>
            </nav>

        </aside>


        <!-- Main Content -->
        <main class="main-content">

            <header class="topbar">
                <h1>Payments</h1>
                <div class="notification">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>

            </header>

            <section class="dashboard-content">

                <!-- Tabs -->
                <div class="tabs">
                    <button class="tab active">All Payments</button>
                    <button class="tab">Pending Payments (0)</button>
                </div>

                <!-- Data Table -->
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Unit</th>

                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Row 1 -->
                            <tr>
                                <td>3C</td>

                                <td>Aug. 13, 2026</td>
                                <td><button class="btn-view">View</button></td>
                            </tr>

                            <!-- Row 2 -->
                            <tr>
                                <td>4D</td>
                                <td>Juan Dela Cruz</td>
                                <td>₱3,500</td>
                                <td><span class="status-badge badge-paid">Paid</span></td>
                                <td>Aug. 22, 2026</td>
                                <td><button class="btn-view">View</button></td>
                            </tr>

                            <!-- Empty Rows to match the visual spacing in the screenshot -->
                            <tr class="empty-row"><td></td><td></td><td></td><td></td><td></td><td></td></tr>
                            <tr class="empty-row"><td></td><td></td><td></td><td></td><td></td><td></td></tr>
                            <tr class="empty-row"><td></td><td></td><td></td><td></td><td></td><td></td></tr>
                        </tbody>
                    </table>
                </div>

            </section>

        </main>

    </div>

</body>
</html>
