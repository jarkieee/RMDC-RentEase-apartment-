<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RentEase - Tenants</title>
    
    <style>
        /* --- Global Resets & Variables --- */
        :root {
            --sidebar-dark: #0f223f;
            --sidebar-light: #133261;
            --sidebar-active: #0a4da3;
            --bg-color: #f4f6f9;
            --text-main: #111827;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
            --card-shadow: 0 2px 10px rgba(0, 0, 0, 0.04);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
        }

        /* --- Layout --- */
        .layout {
            display: flex;
            height: 100vh;
        }

       /* --- Sidebar --- */
.sidebar {
    position: fixed;
    left: 0;
    top: 0;

    width: 240px;
    height: 100vh;

    background: #1E293B;
    color: white;

    display: flex;
    flex-direction: column;

    flex-shrink: 0;
    z-index: 1000;
}

/* --- Sidebar Profile --- */
.sidebar-top {
    background: transparent;

    padding: 25px 20px 20px;

    display: flex;
    flex-direction: column;
    align-items: center;

    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
}

.profile-icon {
    width: 70px;
    height: 70px;

    background-color: #E2E8F0;

    border-radius: 50%;

    display: flex;
    justify-content: center;
    align-items: center;

    margin-bottom: 12px;

    color: #475569;
}

.profile-icon svg {
    width: 40px;
    height: 40px;
}

.profile-name {
    font-size: 18px;
    font-weight: 600;

    margin-bottom: 4px;

    color: white;
}

.profile-role {
    font-size: 13px;
    color: #CBD5E1;
}

/* --- Sidebar Navigation --- */
.sidebar-nav {
    padding: 15px 0;

    display: flex;
    flex-direction: column;

    flex-grow: 1;

    overflow-y: auto;
    /* Hide scrollbar */
    scrollbar-width: none; /* Firefox */  
     -ms-overflow-style: none; /* IE/Edge */
}

.nav-link {
    display: flex;
    align-items: center;

    padding: 13px 20px;

    color: #CBD5E1;

    text-decoration: none;

    font-size: 14px;

    transition: 0.2s ease;
}

.nav-link:hover {
    background: #334155;
    color: white;
}

.nav-link.active {
    background: #2563EB;
    color: white;

    font-weight: 600;
}

        /* --- Main Content Area --- */
        .main-content {
           margin-left: 240px; /* Width of the sidebar */
           width: calc(100% - 240px);

           flex-grow: 1;
           display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        /* Topbar */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background-color: #ffffff;
            border-bottom: 1px solid var(--border-color);
        }

        .topbar h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .notification {
            cursor: pointer;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .notification svg {
            width: 24px;
            height: 24px;
        }

        /* Dashboard Content Area */
        .dashboard-content {
            padding: 30px 40px;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
        }

        /* --- Table Container --- */
        .table-container {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden; 
            margin-bottom: 30px;
            box-shadow: var(--card-shadow);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }

        /* Table Headers */
        th {
            background-color: #ffffff;
            padding: 20px 15px;
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--text-main);
            border-bottom: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
        }

        th:last-child {
            border-right: none;
        }

        /* Table Data */
        td {
            padding: 18px 15px;
            font-size: 0.95rem;
            color: var(--text-main);
            border-bottom: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
        }

        td:last-child {
            border-right: none;
        }

        tr:last-child td {
            border-bottom: none;
        }

        /* Text Colors for Statuses */
        .status-available {
            color: #10b981; /* Green for Available */
            font-weight: 500;
        }

        .status-active {
            color: #10b981; /* Green for Active */
            font-weight: 500;
        }

        .status-inactive {
            color: #9ca3af; /* Gray for Inactive */
            font-weight: 500;
        }

        /* Action Buttons (Eye, Edit) */
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .btn-icon {
            width: 36px;
            height: 36px;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: white;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 0.2s ease;
            color: #6b7280;
        }

        .btn-icon svg {
            width: 18px;
            height: 18px;
        }

        /* Button Hover Colors */
        .btn-icon.view:hover { color: #2563eb; border-color: #2563eb; background-color: #eff6ff; }
        .btn-icon.edit:hover { color: #ea580c; border-color: #ea580c; background-color: #fff7ed; }

        /* --- Bottom Action Button (Add Tenant) --- */
        .page-footer {
            display: flex;
            justify-content: flex-end;
        }

        .add-button {
            background-color: #209bf5; /* Bright blue matching the image */
            color: #111;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .add-button:hover {
            background-color: #1a87d9;
        }

        /* --- Responsive --- */
        @media (max-width: 900px) {
            .layout {
                flex-direction: column;
                overflow-y: auto;
            }
            .sidebar {
                width: 100%;
                height: auto;
            }
            body {
                overflow-y: auto;
            }
            .table-container {
                overflow-x: auto; /* Allow horizontal scroll on small screens */
            }
            .topbar, .dashboard-content {
                padding: 20px;
            }
        }
    </style>

    <link rel="stylesheet" href="../css/style.css">
</head>
