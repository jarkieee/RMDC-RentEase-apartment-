<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Settings - RentEase</title>

    <link rel="stylesheet" href="../css/tenant.css">

    <style>
        .settings-container {
            padding: 30px;
            max-width: 1000px;
        }

        .settings-title {
            margin-bottom: 25px;
        }

        .settings-title h1 {
            margin-bottom: 5px;
        }

        .settings-title p {
            color: #777;
        }

        .settings-section {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.06);
        }

        .settings-section h2 {
            font-size: 19px;
            margin-bottom: 20px;
        }

        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid #eee;
        }

        .setting-item:last-child {
            border-bottom: none;
        }

        .setting-info strong {
            display: block;
            margin-bottom: 5px;
        }

        .setting-info span {
            font-size: 14px;
            color: #777;
        }

        .setting-button {
            padding: 9px 18px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        .setting-button:hover {
            background: #1d4ed8;
        }

        .logout-button {
            background: #dc3545;
        }

        .logout-button:hover {
            background: #b02a37;
        }

        .toggle {
            position: relative;
            width: 45px;
            height: 24px;
        }

        .toggle input {
            display: none;
        }

        .slider {
            position: absolute;
            inset: 0;
            background: #ccc;
            border-radius: 30px;
            cursor: pointer;
        }

        .slider:before {
            content: "";
            position: absolute;
            width: 18px;
            height: 18px;
            left: 3px;
            top: 3px;
            background: white;
            border-radius: 50%;
            transition: 0.3s;
        }

        .toggle input:checked + .slider {
            background: #2563eb;
        }

        .toggle input:checked + .slider:before {
            transform: translateX(21px);
        }

        /* =========================================
           NEW: GENERAL MODAL STYLES
           ========================================= */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .modal-box {
            background: white;
            width: 90%;
            max-width: 450px;
            padding: 30px;
            border-radius: 12px;
            text-align: left;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .modal-box h3 {
            margin-bottom: 20px;
            font-size: 1.25rem;
            color: #111827;
        }

        .modal-box p {
            color: #666;
            margin-bottom: 20px;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .modal-detail {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
            font-size: 0.95rem;
        }
        .modal-detail:last-of-type { border-bottom: none; }
        .modal-detail strong { color: #111827; }
        .modal-detail span { color: #6b7280; }

        .modal-input-group {
            margin-bottom: 15px;
        }
        .modal-input-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: #111827;
        }
        .modal-input-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
        }
        .modal-input-group input:focus { border-color: #2563eb; }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 25px;
        }

        .cancel-button, .confirm-button, .save-button {
            padding: 10px 22px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-weight: 500;
        }

        .cancel-button { background: #e5e7eb; color: #374151; }
        .confirm-button { background: #dc3545; color: white; }
