<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RentEase - Units</title>
    
    <style>
        /* --- Global Resets & Variables --- */
        :root {
            --sidebar-dark: #0f223f;
            --sidebar-light: #133261;
            --sidebar-active: #0a4da3;
            --bg-color: #f4f6f9;
            --text-main: #111827;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
            --card-shadow: 0 2px 10px rgba(0, 0, 0, 0.04);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
        }

        /* --- Layout --- */
        .layout {
            display: flex;
            height: 100vh;
        }

       /* --- Sidebar --- */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 240px;
            height: 100vh;
            background: #1E293B;
            color: white;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            z-index: 1000;
        }

        /* --- Sidebar Profile --- */
        .sidebar-top {
            background: transparent;
            padding: 25px 20px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .profile-icon {
            width: 70px;
            height: 70px;
            background-color: #E2E8F0;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 12px;
            color: #475569;
        }

        .profile-icon svg {
            width: 40px;
            height: 40px;
        }

        .profile-name {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 4px;
            color: white;
        }

        .profile-role {
            font-size: 13px;
            color: #CBD5E1;
        }

        /* --- Sidebar Navigation --- */
        .sidebar-nav {
            padding: 15px 0;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            overflow-y: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .nav-link {
            display: flex;
            align-items: center;
            padding: 13px 20px;
            color: #CBD5E1;
            text-decoration: none;
            font-size: 14px;
            transition: 0.2s ease;
        }

        .nav-link:hover {
            background: #334155;
            color: white;
        }

        .nav-link.active {
            background: #2563EB;
            color: white;
            font-weight: 600;
        }
        
        /* --- Main Content Area --- */
        .main-content {
           margin-left: 240px;
           width: calc(100% - 240px);
            flex-direction: column;
            overflow-y: auto;
        }

        /* Topbar */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background-color: #ffffff;
            border-bottom: 1px solid var(--border-color);
        }

        .topbar h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .notification {
            cursor: pointer;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .notification svg {
            width: 24px;
            height: 24px;
        }

        /* Dashboard Content Area */
        .dashboard-content {
            padding: 30px 40px;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
        }

        /* --- Table Container --- */
        .table-container {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 30px;
            box-shadow: var(--card-shadow);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }

        th {
            background-color: #ffffff;
            padding: 20px 15px;
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--text-main);
            border-bottom: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
        }

        th:last-child { border-right: none; }

        td {
            padding: 18px 15px;
            font-size: 0.95rem;
            color: var(--text-main);
            border-bottom: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
        }

        td:last-child { border-right: none; }
        tr:last-child td { border-bottom: none; }

        /* Text Colors for Status */
        .status-available { color: #10b981; font-weight: 500; }
        .status-occupied { color: #ef4444; font-weight: 500; }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .btn-icon {
            width: 36px;
            height: 36px;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: white;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 0.2s ease;
            color: #6b7280;
        }

        .btn-icon svg { width: 18px; height: 18px; }

        .btn-icon.view:hover { color: #2563eb; border-color: #2563eb; background-color: #eff6ff; }
        .btn-icon.edit:hover { color: #ea580c; border-color: #ea580c; background-color: #fff7ed; }
        .btn-icon.delete:hover { color: #ef4444; border-color: #ef4444; background-color: #fef2f2; }

        /* --- Bottom Action Button (Add Unit) --- */
        .page-footer { display: flex; justify-content: flex-end; }

        .add-button {
            background-color: #209bf5;
            color: #111;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .add-button:hover { background-color: #1a87d9; }

        /* =========================================
           NEW: MODAL STYLES
           ========================================= */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: none; /* Hidden by default */
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            font-size: 1.25rem;
            color: var(--text-main);
        }

        .close-modal {
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-muted);
            border: none;
            background: none;
        }

        .modal-body .form-group {
            margin-bottom: 15px;
        }

        .modal-body label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 5px;
            color: var(--text-main);
        }

        .modal-body input, .modal-body select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
        }

        .modal-body input:focus, .modal-body select:focus {
            border-color: #2563eb;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 25px;
        }

        .btn-cancel {
            background: #e5e7eb;
            color: #374151;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
        }
        
        .btn-save {
            background: #209bf5;
            color: #111;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
        }

        .btn-save:hover { background: #1a87d9; }

        .view-detail {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
        }
        .view-detail:last-child { border-bottom: none; }
        .view-detail strong { color: var(--text-main); }
        .view-detail span { color: var(--text-muted); }

        /* --- Responsive --- */
        @media (max-width: 900px) {
            .layout { flex-direction: column; overflow-y: auto; }
            .sidebar { width: 100%; height: auto; position: relative; }
            .main-content { margin-left: 0; width: 100%; }
            body { overflow-y: auto; }
            .table-container { overflow-x: auto; }
            .topbar, .dashboard-content { padding: 20px; }
        }
    </style>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <div class="layout">

        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-top">
                <div class="profile-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </div>
                <h3 class="profile-name">RMDC</h3>
                <p class="profile-role">Admin</p>
            </div>

            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-link">  <span>📶</span>Dashboard</a>
                <a href="units.html" class="nav-link active"><span>🏠</span>Units</a>
                <a href="tenants.html" class="nav-link"><span>👥</span>Tenants</a>
                <a href="payments.html" class="nav-link"><span>💳</span>Payments</a>
                <a href="appointments.html" class="nav-link"><span>📅</span>Appointments</a>
                <a href="maintenance.html" class="nav-link"><span>🔧</span>Maintenance</a>
                <a href="settings.html" class="nav-link"><span>⚙️</span>Settings</a>
            </nav>
        </aside>


        <!-- Main Content -->
        <main class="main-content">

            <header class="topbar">
                <h1>Units</h1>
                <div class="notification">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                </div>
            </header>

            <section class="dashboard-content">

                <!-- Data Table -->
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Unit</th>
                                <th>Status</th>
                                <th>Amount</th>
                                <th>Type</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="unitsTableBody">
                            <!-- Rows will be dynamically inserted here by JavaScript -->
                        </tbody>
                    </table>
                </div>

                <!-- Bottom Action Button -->
                <div class="page-footer">
                    <button class="add-button" onclick="openAddModal()">Add Unit</button>
                </div>

            </section>

        </main>
    </div>

    <!-- =========================================
         MODAL: ADD / EDIT UNIT
         ========================================= -->
    <div class="modal-overlay" id="unitModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add New Unit</h2>
                <button class="close-modal" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editIndex" value="-1">
                
                <div class="form-group">
                    <label>Unit Name</label>
                    <input type="text" id="unitName" placeholder="e.g., Unit 6F">
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="unitStatus">
                        <option value="Available">Available</option>
                        <option value="Occupied">Occupied</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Amount (₱)</label>
                    <input type="text" id="unitAmount" placeholder="e.g., 3,500">
                </div>
                <div class="form-group">
                    <label>Type</label>
                    <input type="text" id="unitType" placeholder="e.g., 1 BR - 1 Bath">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="closeModal()">Cancel</button>
                <button class="btn-save" onclick="saveUnit()">Save Unit</button>
            </div>
        </div>
    </div>

    <!-- =========================================
         MODAL: VIEW UNIT
         ========================================= -->
    <div class="modal-overlay" id="viewModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Unit Details</h2>
                <button class="close-modal" onclick="closeViewModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="view-detail"><strong>Unit:</strong> <span id="viewUnitName"></span></div>
                <div class="view-detail"><strong>Status:</strong> <span id="viewUnitStatus"></span></div>
                <div class="view-detail"><strong>Amount:</strong> <span id="viewUnitAmount"></span></div>
                <div class="view-detail"><strong>Type:</strong> <span id="viewUnitType"></span></div>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="closeViewModal()">Close</button>
            </div>
        </div>
    </div>


    <script>
        // =========================================
        // 1. DATA STORAGE (Temporary for Demo)
        // =========================================
        // We use an array to hold the data so we can add/edit/delete easily.
        let unitsData = [
            { name: "Unit 1A", status: "Available", amount: "₱ 3,500", type: "1 BR - 1 Bath" },
            { name: "Unit 2B", status: "Available", amount: "₱ 3,500", type: "1 BR - 1 Bath" },
            { name: "Unit 3C", status: "Occupied", amount: "₱ 3,500", type: "1 BR - 1 Bath" },
            { name: "Unit 4D", status: "Occupied", amount: "₱ 3,500", type: "1 BR - 1 Bath" },
            { name: "Unit 5E", status: "Available", amount: "₱ 3,500", type: "1 BR - 1 Bath" }
        ];

        // =========================================
        // 2. RENDER THE TABLE
        // =========================================
        function renderTable() {
            const tbody = document.getElementById("unitsTableBody");
            tbody.innerHTML = ""; // Clear existing rows

            unitsData.forEach((unit, index) => {
                const row = document.createElement("tr");

                // Determine status class for color
                const statusClass = unit.status.toLowerCase() === "available" ? "status-available" : "status-occupied";

                row.innerHTML = `
                    <td>${unit.name}</td>
                    <td class="${statusClass}">${unit.status}</td>
                    <td>${unit.amount}</td>
                    <td>${unit.type}</td>
                    <td>
                        <div class="action-buttons">
                            <button class="btn-icon view" title="View" onclick="openViewModal(${index})">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                            </button>
                            <button class="btn-icon edit" title="Edit" onclick="openEditModal(${index})">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                            </button>
                            <button class="btn-icon delete" title="Delete" onclick="deleteUnit(${index})">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                            </button>
                        </div>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        // =========================================
        // 3. ADD / EDIT LOGIC
        // =========================================
        const unitModal = document.getElementById("unitModal");
        const modalTitle = document.getElementById("modalTitle");
        
        function openAddModal() {
            document.getElementById("editIndex").value = "-1"; // -1 means we are adding new
            document.getElementById("unitName").value = "";
            document.getElementById("unitStatus").value = "Available";
            document.getElementById("unitAmount").value = "";
            document.getElementById("unitType").value = "";
            modalTitle.textContent = "Add New Unit";
            unitModal.style.display = "flex";
        }

        function openEditModal(index) {
            document.getElementById("editIndex").value = index;
            document.getElementById("unitName").value = unitsData[index].name;
            document.getElementById("unitStatus").value = unitsData[index].status;
            document.getElementById("unitAmount").value = unitsData[index].amount;
            document.getElementById("unitType").value = unitsData[index].type;
            modalTitle.textContent = "Edit Unit";
            unitModal.style.display = "flex";
        }

        function closeModal() {
            unitModal.style.display = "none";
        }

        function saveUnit() {
            const index = document.getElementById("editIndex").value;
            const name = document.getElementById("unitName").value;
            const status = document.getElementById("unitStatus").value;
            const amount = document.getElementById("unitAmount").value;
            const type = document.getElementById("unitType").value;

            if (!name || !amount || !type) {
                alert("Please fill in all fields.");
                return;
            }

            const newUnit = { name, status, amount, type };

            if (index === "-1") {
                // Add new
                unitsData.push(newUnit);
            } else {
                // Edit existing
                unitsData[index] = newUnit;
            }

            renderTable(); // Re-draw the table
            closeModal();
        }

        // =========================================
        // 4. VIEW LOGIC
        // =========================================
        const viewModal = document.getElementById("viewModal");

        function openViewModal(index) {
            document.getElementById("viewUnitName").textContent = unitsData[index].name;
            document.getElementById("viewUnitStatus").textContent = unitsData[index].status;
            document.getElementById("viewUnitAmount").textContent = unitsData[index].amount;
            document.getElementById("viewUnitType").textContent = unitsData[index].type;
            viewModal.style.display = "flex";
        }

        function closeViewModal() {
            viewModal.style.display = "none";
        }

        // =========================================
        // 5. DELETE LOGIC
        // =========================================
        function deleteUnit(index) {
            if (confirm("Are you sure you want to delete this unit?")) {
                unitsData.splice(index, 1); // Remove from array
                renderTable(); // Re-draw the table
            }
        }

        // Close modal if user clicks outside the white box
        window.onclick = function(event) {
            if (event.target === unitModal) closeModal();
            if (event.target === viewModal) closeViewModal();
        }

        // Initialize the table on page load
        renderTable();

    </script>

</body>
</html>
