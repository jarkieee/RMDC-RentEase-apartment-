<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RentEase - Create an Account</title>

    <style>
        /* --- Global Resets & Fonts --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body.login-page {
            /* Same background image as the login page */
            background-image: url('https://images.unsplash.com/photo-1545324418-cc1a3fa10c00?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* --- The Logo Outside the Card --- */
        .external-logo {
            position: absolute;
            top: 50%;
            left: 10%;
            transform: translateY(-50%);
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .external-logo svg {
            width: 80px;
            height: 80px;
            fill: #1a4b8c; 
            stroke: #4da6ff; 
            stroke-width: 2px;
        }

        .external-logo-text {
            display: flex;
            flex-direction: column;
            line-height: 1;
        }

        .external-logo-text .rent {
            font-size: 3rem;
            font-weight: 800;
            color: #1a4b8c;
            letter-spacing: -1px;
            -webkit-text-stroke: 1px #4da6ff; 
        }

        .external-logo-text .ease {
            font-size: 3rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -1px;
            margin-left: 2px;
            -webkit-text-stroke: 1px #4da6ff; 
        }

        .external-logo-text .apartment {
            font-size: 1.2rem;
            color: #1a4b8c;
            font-weight: 500;
            margin-top: 5px;
            letter-spacing: 1px;
            -webkit-text-stroke: 0.5px #4da6ff;
        }

        /* --- The Glassmorphism Card --- */
        .login-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            /* Shift the card slightly to the right to balance the logo on the left */
            margin-left: 20%; 
        }

        .login-card {
            background: rgba(220, 230, 245, 0.6); 
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 480px; /* Slightly wider to accommodate longer text */
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        /* --- Header Text --- */
        .form-header {
            margin-bottom: 25px;
        }

        .form-header h2 {
            font-size: 1.8rem;
            color: #111;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .form-header p {
            font-size: 1rem;
            color: #333;
        }

        /* --- Form Elements --- */
        .input-group {
            margin-bottom: 15px;
        }

        .input-group input {
            width: 100%;
            padding: 16px 20px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            color: #333;
            background-color: #ffffff;
            outline: none;
        }

        .input-group input::placeholder {
            color: #333; 
            font-weight: 400;
        }

        .input-group input:focus {
            box-shadow: 0 0 0 2px #1a4b8c;
        }

        /* --- Register Button --- */
        .register-button {
            width: 100%;
            padding: 16px;
            background-color: #209bf5; /* Bright blue matching the image */
            color: #111; /* Dark text for contrast */
            border: none;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 10px;
        }

        .register-button:hover {
            background-color: #1a87d9;
        }

        /* --- Footer Link --- */
        .auth-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.95rem;
            color: #111;
        }

        .auth-footer a {
            color: #111;
            text-decoration: underline;
            font-weight: 500;
        }

        .auth-footer a:hover {
            color: #1a4b8c;
        }

        /* --- Responsive Design --- */
        @media (max-width: 900px) {
            .external-logo {
                position: relative;
                top: 0;
                left: 0;
                transform: none;
                margin-bottom: 20px;
                justify-content: center;
            }
            
            body.login-page {
                flex-direction: column;
            }

            .login-container {
                margin-left: 0;
            }
        }
    </style>
</head>

<body class="login-page">

    <!-- Logo positioned outside the card -->
    <div class="external-logo">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <path d="M50 10 L10 45 L20 45 L20 90 L45 90 L45 60 L55 60 L55 90 L80 90 L80 45 L90 45 Z" fill="#1a4b8c" stroke="#4da6ff" stroke-width="2" stroke-linejoin="round"/>
        </svg>
        <div class="external-logo-text">
            <div style="display: flex;">
                <span class="rent">Rent</span><span class="ease">Ease</span>
            </div>
            <span class="apartment">Apartment</span>
        </div>
    </div>

    <div class="login-container">
        <div class="login-card">
            
            <div class="form-header">
                <h2>Create an Account</h2>
                <p>Please fill in the details below</p>
            </div>

            <form id="registerForm">
                
                <div class="input-group">
                    <input type="text" id="fullName" placeholder="Full Name" required>
                </div>

                <div class="input-group">
                    <input type="email" id="email" placeholder="Email" required>
                </div>

                <div class="input-group">
                    <input type="tel" id="contactNumber" placeholder="Contact Number" required>
                </div>

                <div class="input-group">
                    <input type="password" id="password" placeholder="Password" required>
                </div>

                <div class="input-group">
                    <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
                </div>

                <button type="submit" class="register-button">
                    Register
                </button>

                <div class="auth-footer">
                    Already have an account? <a href="login.html">Login</a>
                </div>

            </form>
        </div>
    </div>

    <script>
        document.getElementById("registerForm").addEventListener("submit", function(event) {
            event.preventDefault(); // Prevent default form submission

            // Basic validation example: Check if passwords match
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            if (password !== confirmPassword) {
                alert("Passwords do not match. Please try again.");
                return;
            }

            // Simulate successful registration (Redirect to login page)
            // In a real app, you would send this data to a backend server here.
            alert("Account created successfully! Redirecting to login...");
            
            // Assuming the login page is named 'index.html' or 'login.html'
            window.location.href = "index.html"; 
        });
    </script>

</body>
</html>
